name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: v1.60.3

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run All Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build CGO-free Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/server ./cmd/server
