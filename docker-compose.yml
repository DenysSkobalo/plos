services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plos-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/plos.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  plos_db_data:
    driver: local
